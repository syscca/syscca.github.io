<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<title>小小双语乐园 · Dunia Kecil Dwi Bahasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body{
    font-family:'Baloo 2','ZCOOL KuaiLe','Comic Sans MS','PingFang SC','Microsoft YaHei',sans-serif;
    background:linear-gradient(180deg,#aee9ff 0%,#d9f7ff 45%,#eaffd6 100%);
    color:#3a2e5e; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  /* 漂浮泡泡背景 */
  .bubble{position:fixed;bottom:-120px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(255,255,255,.25));
    animation:floatUp linear infinite;pointer-events:none;z-index:0;}
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) scale(1);opacity:0;}
    10%{opacity:.8;}
    50%{transform:translateY(-55vh) translateX(30px) scale(1.08);}
    100%{transform:translateY(-115vh) translateX(-20px) scale(.95);opacity:0;}
  }
  #app{position:relative;z-index:1;height:100%;max-width:860px;margin:0 auto;
    display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);}

  /* 顶部栏 */
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 2px;flex:none;}
  .icon-btn{border:none;cursor:pointer;border-radius:22px;background:#fff;color:#5a4b9e;
    font-family:inherit;font-weight:800;font-size:clamp(15px,2.4vh,20px);
    padding:10px 18px;box-shadow:0 5px 0 #d8cdf5;transition:transform .08s,box-shadow .08s;
    display:flex;align-items:center;gap:6px;}
  .icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d8cdf5;}
  .lang-toggle{margin-left:auto;display:flex;background:#ffffffcc;border-radius:24px;padding:4px;box-shadow:0 4px 0 #d8cdf5;}
  .lang-toggle button{border:none;background:transparent;font-family:inherit;font-weight:800;
    font-size:clamp(13px,2.1vh,17px);padding:8px 16px;border-radius:20px;cursor:pointer;color:#8a7db8;}
  .lang-toggle button.on{background:#ffb84d;color:#fff;box-shadow:0 3px 0 #e89a25;}

  .screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:screenIn .35s ease;}
  @keyframes screenIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}

  /* 首页 */
  .title-wrap{text-align:center;padding:1vh 0 1.5vh;flex:none;}
  .game-title{font-size:clamp(30px,6vh,52px);color:#ff6b9d;
    text-shadow:0 3px 0 #fff,0 6px 0 rgba(180,120,200,.35);line-height:1.15;}
  .game-sub{font-size:clamp(16px,2.8vh,24px);color:#4d86c7;margin-top:6px;font-weight:700;}
  .cat-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;
    grid-template-rows:repeat(9,minmax(0,1fr));
    gap:clamp(5px,.9vh,10px);padding-bottom:10px;min-height:0;}
  .cat-card .emoji{font-size:clamp(24px,5.8vh,50px);line-height:1;}
  @media (orientation:landscape){
    /* 压缩标题区，把高度让给卡片 */
    .title-wrap{padding:.4vh 0 .6vh;}
    .game-title{font-size:clamp(18px,3.4vh,28px);text-shadow:0 2px 0 #fff;}
    .game-sub{font-size:clamp(11px,1.8vh,15px);margin-top:2px;}
    .cat-grid{grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(6,minmax(0,1fr));gap:clamp(4px,.8vh,8px);padding-bottom:6px;}
    .cat-card{gap:1px;border-radius:18px;box-shadow:0 4px 0 rgba(0,0,0,.10);min-height:0;overflow:hidden;}
    .cat-card .emoji{font-size:clamp(16px,4.6vh,36px);}
    .cat-card .zh{font-size:clamp(10px,1.9vh,15px);}
    .cat-card .id{font-size:clamp(8px,1.5vh,12px);}
  }
  .cat-card{border:none;cursor:pointer;border-radius:34px;background:#fff;
    box-shadow:0 8px 0 rgba(0,0,0,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;transition:transform .1s;font-family:inherit;animation:wobble 2.6s ease-in-out infinite;}
  .cat-card:active{transform:translateY(6px) scale(.98);box-shadow:0 2px 0 rgba(0,0,0,.10);}
  .cat-card .zh{font-size:clamp(14px,2.4vh,22px);font-weight:800;}
  .cat-card .id{font-size:clamp(11px,1.9vh,16px);font-weight:700;color:#7b6fc0;}
  .cat-card:nth-child(1){background:linear-gradient(180deg,#fff,#fff3d6);}
  .cat-card:nth-child(2){background:linear-gradient(180deg,#fff,#ffe3ec);}
  .cat-card:nth-child(3){background:linear-gradient(180deg,#fff,#e3f4ff);}
  .cat-card:nth-child(4){background:linear-gradient(180deg,#fff,#e8ffe4);}
  .cat-card:nth-child(5){background:linear-gradient(180deg,#fff,#e0f0ff);}
  .cat-card:nth-child(6){background:linear-gradient(180deg,#fff,#fff0e0);}
  .cat-card:nth-child(7){background:linear-gradient(180deg,#fff,#f0e6ff);}
  .cat-card:nth-child(8){background:linear-gradient(180deg,#fff,#e6fff6);}
  .cat-card:nth-child(9){background:linear-gradient(180deg,#fff,#ffeef4);}
  .cat-card:nth-child(10){background:linear-gradient(180deg,#fff,#f0f8ff);}
  .cat-card:nth-child(11){background:linear-gradient(180deg,#fff,#fdf6d8);}
  .cat-card:nth-child(12){background:linear-gradient(180deg,#fff,#e6f7ff);}
  .cat-card:nth-child(13){background:linear-gradient(180deg,#fff,#f4f0ff);}
  .cat-card:nth-child(14){background:linear-gradient(180deg,#fff,#fef0f6);}
  .cat-card:nth-child(15){background:linear-gradient(180deg,#fff,#eef7ff);}
  .cat-card.chat-entry{
    background:linear-gradient(180deg,#e7fbff,#b8ecff);
    border:4px solid #8fd9ff;
  }
  .cat-card.chat-entry .zh{color:#2e8bc7;}
  .cat-card.chat-entry-2{
    background:linear-gradient(180deg,#fff3e0,#ffd9b0);
    border-color:#ffb870;
  }
  .cat-card.chat-entry-2 .zh{color:#d9762e;}
  .cat-card:nth-child(2){animation-delay:.3s;}
  .cat-card:nth-child(3){animation-delay:.6s;}
  .cat-card:nth-child(4){animation-delay:.9s;}
  .cat-card:nth-child(5){animation-delay:1.2s;}
  .cat-card:nth-child(6){animation-delay:1.5s;}
  .cat-card:nth-child(7){animation-delay:1.8s;}
  .cat-card:nth-child(8){animation-delay:2.1s;}
  .cat-card:nth-child(9){animation-delay:2.4s;}
  .cat-card:nth-child(10){animation-delay:2.7s;}
  .cat-card:nth-child(11){animation-delay:3.0s;}
  .cat-card:nth-child(12){animation-delay:3.3s;}
  .cat-card:nth-child(13){animation-delay:3.6s;}
  .cat-card:nth-child(14){animation-delay:3.9s;}
  .cat-card:nth-child(15){animation-delay:4.2s;}
  .cat-card:nth-child(16){animation-delay:4.5s;}
  .cat-card:nth-child(17){animation-delay:4.8s;}
  @keyframes wobble{0%,100%{transform:rotate(-1.2deg);}50%{transform:rotate(1.2deg);}}

  /* 模式选择 */
  .mode-head{text-align:center;font-size:clamp(26px,5vh,44px);font-weight:800;color:#ff8c42;padding:2vh 0;flex:none;}
  .mode-grid{flex:1;display:flex;flex-direction:column;gap:clamp(14px,3vh,30px);justify-content:center;padding-bottom:20px;}
  .mode-btn{border:none;cursor:pointer;border-radius:40px;display:flex;align-items:center;justify-content:center;gap:18px;
    padding:clamp(20px,4.5vh,42px) 20px;font-family:inherit;color:#fff;
    box-shadow:0 9px 0 rgba(0,0,0,.14);transition:transform .1s;}
  .mode-btn:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.14);}
  .mode-btn.listen{background:linear-gradient(180deg,#7cd9ff,#3faeef);}
  .mode-btn.find{background:linear-gradient(180deg,#ffd24d,#ffa92e);}
  .mode-btn .m-emoji{font-size:clamp(48px,10vh,90px);}
  .mode-btn .m-txt .zh{display:block;font-size:clamp(30px,6vh,52px);font-weight:800;line-height:1.1;}
  .mode-btn .m-txt .id{display:block;font-size:clamp(16px,2.8vh,24px);font-weight:700;opacity:.95;}

  /* 学习卡 */
  .learn-stage{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:10px;}
  .learn-card{flex:1;background:#fff;border-radius:44px;box-shadow:0 10px 0 rgba(0,0,0,.09);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;
    cursor:pointer;min-height:0;padding:2vh 10px;}
  .learn-card:active .card-visual{transform:scale(.92);}
  .card-visual{display:flex;align-items:center;justify-content:center;transition:transform .15s;animation:happy 2.4s ease-in-out infinite;}
  @keyframes happy{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
  .card-emoji{font-size:clamp(100px,30vh,240px);line-height:1;}
  .color-ball{width:clamp(110px,28vh,220px);height:clamp(110px,28vh,220px);border-radius:50%;
    box-shadow:inset -10px -14px 0 rgba(0,0,0,.10),0 10px 24px rgba(0,0,0,.15);}
  .big-num{font-size:clamp(120px,34vh,280px);font-weight:800;line-height:.9;
    background:linear-gradient(180deg,#ff8c42,#ff5e9c);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .num-dots{font-size:clamp(22px,4.5vh,40px);letter-spacing:4px;}
  .word-zh{font-size:clamp(34px,7vh,64px);font-weight:800;color:#ff6b9d;}
  .word-id{font-size:clamp(22px,4.4vh,38px);font-weight:700;color:#4d86c7;}
  .tap-hint{font-size:clamp(14px,2.4vh,20px);color:#a99fd0;font-weight:700;margin-top:.4vh;}
  .learn-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;flex:none;}
  .nav-arrow{width:clamp(64px,11vh,96px);height:clamp(64px,11vh,96px);border-radius:50%;border:none;cursor:pointer;
    background:#b8a8ff;color:#fff;font-size:clamp(30px,5vh,44px);font-weight:800;
    box-shadow:0 6px 0 #8e7be0;transition:transform .08s;}
  .nav-arrow:active{transform:translateY(4px);box-shadow:0 2px 0 #8e7be0;}
  .dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:55%;}
  .dots i{width:11px;height:11px;border-radius:50%;background:#cfc6ee;display:block;}
  .dots i.on{background:#ff8c42;transform:scale(1.35);}

  /* 问答游戏 */
  .quiz-head{text-align:center;flex:none;padding:1vh 0;}
  .quiz-ask{font-size:clamp(20px,3.6vh,30px);font-weight:800;color:#7b6fc0;}
  .quiz-target{font-size:clamp(40px,8vh,72px);font-weight:800;color:#ff6b3d;line-height:1.1;}
  .quiz-target .small{font-size:.45em;color:#4d86c7;display:block;}
  .replay-btn{border:none;cursor:pointer;background:#fff;border-radius:50%;width:clamp(52px,8vh,70px);height:clamp(52px,8vh,70px);
    font-size:clamp(24px,4vh,34px);box-shadow:0 5px 0 #d8cdf5;margin-top:6px;}
  .replay-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d8cdf5;}
  .quiz-options{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vh,18px);align-content:center;padding:1vh 0;min-height:0;}
  @media (max-width:560px),(max-height:560px){
    .quiz-options{grid-template-columns:1fr;}
  }
  .opt{border:none;cursor:pointer;border-radius:32px;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.10);
    display:flex;align-items:center;justify-content:center;min-height:0;padding:8px;transition:transform .1s;}
  .opt:active{transform:translateY(4px);}
  .opt .opt-emoji{font-size:clamp(60px,16vh,150px);line-height:1;}
  .opt .opt-color{width:clamp(64px,13vh,120px);height:clamp(64px,13vh,120px);border-radius:50%;
    box-shadow:inset -6px -10px 0 rgba(0,0,0,.10);}
  .opt .opt-num{font-size:clamp(60px,15vh,140px);font-weight:800;color:#7c5cff;}
  .opt.correct{background:linear-gradient(180deg,#d8ffc9,#aef0a0);animation:popGood .5s ease;}
  .opt.wrong{animation:shake .4s ease;background:#ffe0e0;}
  @keyframes popGood{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-10px);}75%{transform:translateX(10px);}}
  .star-bar{display:flex;justify-content:center;gap:8px;height:34px;flex:none;}
  .star-bar i{font-size:clamp(22px,3.6vh,30px);filter:grayscale(1) opacity(.35);}
  .star-bar i.got{filter:none;animation:starPop .4s ease;}
  @keyframes starPop{0%{transform:scale(0) rotate(-40deg);}70%{transform:scale(1.4) rotate(10deg);}100%{transform:scale(1);}}

  /* 通关画面 */
  .finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vh;text-align:center;}
  .trophy{font-size:clamp(110px,28vh,230px);animation:trophyBounce 1.2s ease infinite;}
  @keyframes trophyBounce{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-16px) scale(1.06);}}
  .finish-zh{font-size:clamp(34px,7vh,60px);font-weight:800;color:#ff6b9d;text-shadow:0 3px 0 #fff;}
  .finish-id{font-size:clamp(20px,4vh,34px);font-weight:700;color:#4d86c7;}
  .finish-stars{font-size:clamp(30px,6vh,52px);letter-spacing:6px;}
  .finish-btns{display:flex;gap:14px;margin-top:1vh;}
  .big-action{border:none;cursor:pointer;border-radius:28px;font-family:inherit;font-weight:800;
    font-size:clamp(20px,3.6vh,28px);padding:16px 28px;color:#fff;
    box-shadow:0 7px 0 rgba(0,0,0,.14);transition:transform .08s;}
  .big-action:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .big-action.again{background:linear-gradient(180deg,#7be08a,#3fbf5c);box-shadow:0 7px 0 #2c9444;}
  .big-action.home{background:linear-gradient(180deg,#ffb84d,#ff9d2e);box-shadow:0 7px 0 #d97f15;}

  /* 情景对话游戏 */
  .chat-stage{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:6px;}
  .chat-char{display:flex;align-items:center;gap:clamp(8px,1.6vh,16px);flex:none;padding:1vh 2px;}
  .chat-who{font-size:clamp(60px,14vh,120px);line-height:1;animation:happy 2.4s ease-in-out infinite;flex:none;}
  .bubble{position:relative;background:#fff;border-radius:26px;padding:1.2vh 20px;
    box-shadow:0 6px 0 rgba(90,75,158,.15);flex:1;min-width:0;}
  .b-zh{font-size:clamp(23px,4.6vh,38px);font-weight:800;color:#ff6b9d;line-height:1.2;}
  .b-id{font-size:clamp(15px,2.9vh,24px);font-weight:700;color:#4d86c7;line-height:1.2;}
  .chat-options{flex:1;display:flex;flex-direction:column;justify-content:center;
    gap:clamp(10px,2vh,20px);min-height:0;padding:1vh 0;}
  .chat-opt{border:none;cursor:pointer;border-radius:30px;background:#fff;
    box-shadow:0 7px 0 rgba(0,0,0,.10);display:flex;align-items:center;gap:clamp(12px,2.4vh,22px);
    padding:clamp(10px,2.4vh,22px) 22px;transition:transform .1s;font-family:inherit;}
  .chat-opt:active{transform:translateY(4px);}
  .chat-opt .co-emoji{font-size:clamp(36px,7vh,64px);flex:none;}
  .chat-opt .co-text{display:flex;flex-direction:column;text-align:left;line-height:1.15;}
  .chat-opt .co-zh{font-size:clamp(26px,5.2vh,44px);font-weight:800;color:#ff6b9d;}
  .chat-opt .co-id{font-size:clamp(16px,3.2vh,26px);font-weight:700;color:#4d86c7;}
  .chat-opt.correct{background:linear-gradient(180deg,#d8ffc9,#aef0a0);animation:popGood .5s ease;}
  .chat-opt.wrong{animation:shake .4s ease;background:#ffe0e0;}
  .chat-dots{flex:none;padding-top:6px;}

  /* 彩带 */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
  .confetti-piece{position:absolute;top:-30px;border-radius:3px;animation:confettiFall linear forwards;}
  @keyframes confettiFall{
    to{transform:translateY(110vh) rotate(720deg);opacity:.9;}
  }
</style>
</head>
<body>
<div id="confetti"></div>
<div id="app"></div>

/* ================= 真人语音 MP3（离线时回退浏览器合成） ================= */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} }
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(prefix){
  return voices.find(v=>v.lang.toLowerCase().replace('_','-').startsWith(prefix));
}
/* 浏览器合成（兜底） */
function speakTTS(text, lang){
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window)){ setTimeout(resolve,300); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang==='zh' ? 'zh-CN' : 'id-ID';
    const v = pickVoice(lang==='zh'?'zh':'id');
    if(v) u.voice = v;
    u.rate = 0.85; u.pitch = 1.15;
    let done = false;
    const fin = ()=>{ if(!done){ done=true; res(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 2800);
    speechSynthesis.speak(u);
    function res(){ resolve(); }
  });
}

/* MP3 缓存 */
const audioCache = {};
function getAudio(key){
  if(!audioCache[key]){
    const a = new Audio('audio/' + key + '.mp3');
    a.preload = 'auto';
    a.addEventListener('error', ()=>{ a._failed = true; }, {once:true});
    audioCache[key] = a;
  }
  return audioCache[key];
}

/* 序列控制：新序列自动打断旧序列 */
let seqId = 0;
function stopVoice(){
  seqId++;
  Object.values(audioCache).forEach(a=>{ try{ a.pause(); }catch(e){} });
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
const alive = t => t === seqId;
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* 播放单条：MP3 成功则用 MP3，失败回退 TTS */
function oneClip(step, token){
  return new Promise(resolve=>{
    if(!alive(token)){ resolve('aborted'); return; }
    const a = getAudio(step.key);
    let settled = false;
    const done = s => { if(!settled){ settled = true; resolve(s); } };
    const fallback = ()=>{
      if(!alive(token)){ done('aborted'); return; }
      speakTTS(step.text, step.lang).then(()=>done('tts'));
    };
    const startPlay = ()=>{
      if(a._failed){ fallback(); return; }
      Object.values(audioCache).forEach(o=>{ if(o!==a){ try{o.pause();}catch(e){} } });
      const onEnd = ()=>{ cleanup(); done('ok'); };
      const onErr = ()=>{ cleanup(); fallback(); };
      function cleanup(){ a.removeEventListener('ended',onEnd); a.removeEventListener('error',onErr); }
      a.addEventListener('ended',onEnd);
      a.addEventListener('error',onErr);
      try{ a.currentTime = 0; }catch(e){}
      a.play().then(()=>{}, ()=>{ cleanup(); fallback(); });
    };
    if(a._failed){ fallback(); return; }
    if(a.readyState >= 2){ startPlay(); return; }
    const ready = ()=>{ rem(); startPlay(); };
    const errH  = ()=>{ rem(); fallback(); };
    function rem(){ a.removeEventListener('canplay',ready); a.removeEventListener('error',errH); }
    a.addEventListener('canplay',ready);
    a.addEventListener('error',errH);
    setTimeout(()=>{ if(!settled){ rem(); fallback(); } }, 2000);
  });
}

/* 顺序播放多段语音，全部结束后 resolve；被打断则立即 resolve */
async function playSequence(steps){
  const token = ++seqId;
  Object.values(audioCache).forEach(a=>{ try{ a.pause(); }catch(e){} });
  for(const s of steps){
    if(!alive(token)) return;
    const r = await oneClip(s, token);
    if(!alive(token) || r==='aborted') return;
    if(s.gap) await wait(s.gap);
  }
}

/* ================= 音效（WebAudio 合成，无需素材） ================= */
let AC = null;
function audioCtx(){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
  }catch(e){}
  return AC;
}
function beep(freq, delay, dur, type, vol){
  const c = audioCtx(); if(!c) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}

    p.style.left = Math.random()*100+'vw';

        ${Object.keys(DATA).map(k=>`
          <button class="cat-card" onclick="chooseCat('${k}')">
            <span class="emoji">${DATA[k].emoji}</span>
            <span class="zh">${DATA[k].name.zh}</span>
            <span class="id">${DATA[k].name.id}</span>
          </button>`).join('')}
          <button class="cat-card chat-entry" onclick="startChat(0)">
            <span class="emoji">💬</span>
            <span class="zh">我会打招呼</span>
            <span class="id">Belajar Menyapa</span>
          </button>
          <button class="cat-card chat-entry chat-entry-2" onclick="startChat(1)">
            <span class="emoji">🍼</span>
            <span class="zh">我会说日常</span>
            <span class="id">Bahasa Sehari-hari</span>
          </button>
      </div>
    </div>`;
  }
  else if(screen==='mode'){
    app.innerHTML = topbar(true) + `<div class="screen">
      <div class="mode-head">${DATA[cat].emoji} ${DATA[cat].name[LANG]}</div>
      <div class="mode-grid">
        <button class="mode-btn listen" onclick="startLearn()">
          <span class="m-emoji">👂</span>
          <span class="m-txt"><span class="zh">${UI.listen[LANG]}</span><span class="id">Dengarkan</span></span>
        </button>
        <button class="mode-btn find" onclick="startQuiz()">
          <span class="m-emoji">🔍</span>
          <span class="m-txt"><span class="zh">${UI.find[LANG]}</span><span class="id">Temukan</span></span>
        </button>
      </div>
    </div>`;
  }
  else if(screen==='learn'){
    const items = DATA[cat].items;
    const item = items[cardIndex];
    app.innerHTML = topbar(true) + `<div class="screen">
      <div class="learn-stage">
        <div class="learn-card" id="learnCard">
          <div class="card-visual">${visualHTML(item,'card')}</div>
          ${item.n ? `<div class="num-dots">${'⭐'.repeat(item.n)}</div>`:''}
          <div class="word-zh">${item.zh}</div>
          <div class="word-id">${item.id}</div>
          <div class="tap-hint">${UI.tapHint[LANG]}</div>
        </div>
        <div class="learn-nav">
          <button class="nav-arrow" onclick="moveCard(-1)">‹</button>
          <div class="dots">${items.map((_,i)=>`<i class="${i===cardIndex?'on':''}"></i>`).join('')}</div>
          <button class="nav-arrow" onclick="moveCard(1)">›</button>
        </div>
      </div>
    </div>`;
    $('#learnCard').addEventListener('click',()=>{ sfx.pop(); speakCard(item); });
    speakCard(item);
  }
  else if(screen==='quiz'){
    app.innerHTML = topbar(true) + `<div class="screen">
      <div class="quiz-head">
        <div class="quiz-ask">${LANG==='zh'?'找一找':'Cari ya'}</div>
        <div class="quiz-target">
          ${quiz.target[LANG]}
          <span class="small">${quiz.target[LANG==='zh'?'id':'zh']}</span>
        </div>
        <button class="replay-btn" onclick="ask()">🔊</button>
      </div>
      <div class="star-bar">
        ${Array.from({length:quiz.total},(_,i)=>`<i class="${i<quiz.stars?'got':''}">⭐</i>`).join('')}
      </div>
      <div class="quiz-options" id="options">
        ${quiz.options.map((it,idx)=>`
          <button class="opt" data-idx="${idx}">${visualHTML(it,'opt')}</button>`).join('')}
      </div>
    </div>`;
    document.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click',()=>answer(parseInt(btn.dataset.idx),btn));
    });
    ask();
  }
  else if(screen==='finish'){
    app.innerHTML = topbar(true) + `<div class="screen">
      <div class="finish">
        <div class="trophy">🏆</div>
        <div class="finish-stars">${'⭐'.repeat(quiz.stars)}</div>
        <div class="finish-zh">${UI.finishZh}</div>
        <div class="finish-id">${UI.finishId}</div>
        <div class="finish-btns">
          <button class="big-action again" onclick="startQuiz()">🔁 ${UI.again[LANG]}</button>
          <button class="big-action home" onclick="goHome()">🏠 ${UI.home[LANG]}</button>
        </div>
      </div>
    </div>`;
    /* 通关祝贺：主语言在前 */
    const steps = LANG==='zh'
      ? [{key:'finish-zh',text:UI.finishZh,lang:'zh',gap:220},{key:'finish-id',text:UI.finishId,lang:'id'}]
      : [{key:'finish-id',text:UI.finishId,lang:'id',gap:220},{key:'finish-zh',text:UI.finishZh,lang:'zh'}];
    playSequence(steps);
  }
  else if(screen==='chat'){
    const scenes = chat.set ? CHAT_SCENES2 : CHAT_SCENES;
    const sc = scenes[chat.scene];
    /* 合并两组短语表用于查找 */
    const phraseMap = chat.set ? Object.assign({},CHAT_PHRASES,CHAT_PHRASES2) : CHAT_PHRASES;
    app.innerHTML = topbar(true) + `<div class="screen">
      <div class="chat-stage">
        <div class="chat-char">
          <div class="chat-who" id="chatWho">${sc.who}</div>
          <div class="bubble">
            <div class="b-zh">${sc.line.zh}</div>
            <div class="b-id">${sc.line.id}</div>
          </div>
          <button class="replay-btn" onclick="chatLine()">🔊</button>
        </div>
        <div class="chat-options" id="chatOptions">
          ${sc.options.map((op,idx)=>{
            const p = phraseMap[op.key];
            return `<button class="chat-opt" data-idx="${idx}">
              <span class="co-emoji">${op.emoji}</span>
              <span class="co-text"><span class="co-zh">${p.zh}</span><span class="co-id">${p.id}</span></span>
            </button>`;
          }).join('')}
        </div>
        <div class="dots chat-dots">
          ${scenes.map((_,i)=>`<i class="${i===chat.scene?'on':''}"></i>`).join('')}
        </div>
      </div>
    </div>`;
    document.querySelectorAll('.chat-opt').forEach(b=>{
      b.addEventListener('click',()=>chatAnswer(parseInt(b.dataset.idx),b));
    });
    chatLine();
  }
  else if(screen==='chatfinish'){
    const meta = chat.set
      ? {emoji:'🍼', zh:'日常用语我会说！', id:'Sudah bisa bahasa sehari-hari!',
         fzh:'日常用语我会说，真棒！', fid:'Sudah bisa bahasa sehari-hari, hebat!',
         kzh:'chat2finish-zh', kid:'chat2finish-id'}
      : {emoji:'🎉', zh:'你会打招呼啦！', id:'Kamu sudah bisa menyapa!',
         fzh:'你会打招呼啦，真棒！', fid:'Kamu sudah bisa menyapa, hebat!',
         kzh:'chatfinish-zh', kid:'chatfinish-id'};
    app.innerHTML = topbar(true) + `<div class="screen">
      <div class="finish">
        <div class="trophy">${meta.emoji}</div>
        <div class="finish-stars">💬</div>
        <div class="finish-zh">${meta.zh}</div>
        <div class="finish-id">${meta.id}</div>
        <div class="finish-btns">
          <button class="big-action again" onclick="startChat(${chat.set})">🔁 ${UI.again[LANG]}</button>
          <button class="big-action home" onclick="goHome()">🏠 ${UI.home[LANG]}</button>
        </div>
      </div>
    </div>`;
    const steps = LANG==='zh'
      ? [{key:meta.kzh,text:meta.fzh,lang:'zh',gap:220},{key:meta.kid,text:meta.fid,lang:'id'}]
      : [{key:meta.kid,text:meta.fid,lang:'id',gap:220},{key:meta.kzh,text:meta.fzh,lang:'zh'}];
    playSequence(steps);
  }
}

/* ================= 交互逻辑 ================= */
function setLang(l){ LANG=l; render(); }
function goHome(){ stopVoice(); screen='home'; cat=null; render(); }
function chooseCat(k){ sfx.pop(); cat=k; screen='mode'; render(); }

/* 学习模式 */
function startLearn(){
  sfx.pop(); cardIndex=0; screen='learn'; render();
}
function moveCard(d){
  sfx.pop();
  const n = DATA[cat].items.length;
  cardIndex = (cardIndex + d + n) % n;
  render();
}

/* 问答模式 */
function startQuiz(){
  sfx.pop();
  quiz.round=0; quiz.stars=0; quiz.locked=false;
  newQuestion();
  screen='quiz';
  render();
}
function newQuestion(){
  const pool = DATA[cat].items;
  let target;
  do { target = pool[Math.floor(Math.random()*pool.length)]; }
  while(quiz.target && target===quiz.target && pool.length>3);
  const distract = shuffle(pool.filter(x=>x!==target)).slice(0,2);
  quiz.target = target;
  quiz.options = shuffle([target,...distract]);
  quiz.locked = false;
}
function ask(){
  if(quiz.locked) return;
  const t = quiz.target;
  const k = itemKeys(t);
  /* 日常用语/动作/味道是整句或形容词，直接朗读短语，不问"在哪里" */
  if(cat==='daily' || cat==='actions' || cat==='tastes'){
    const other = LANG==='zh' ? 'id' : 'zh';
    playSequence([
      {key:k[LANG], text:t[LANG], lang:LANG, gap:200},
      {key:k[other], text:t[other], lang:other}
    ]);
    return;
  }
  if(LANG==='zh'){
    playSequence([{key:k.askzh, text:`${t.zh}在哪里呀？`, lang:'zh', gap:0}]);
  } else {
    playSequence([{key:k.askid, text:`Di mana ${t.id}?`, lang:'id', gap:0}]);
  }
}
function answer(idx, btn){
  if(quiz.locked) return;
  const it = quiz.options[idx];
  if(it===quiz.target){
    quiz.locked = true;
    btn.classList.add('correct');
    quiz.stars++;
    sfx.good();
    confettiBurst(30);
    quiz.round++;
    /* 跟读：主语言单词 → 另一语言单词 → 夸奖；播完再进入下一题 */
    const other = LANG==='zh' ? 'id' : 'zh';
    const k = itemKeys(it);
    const pIdx = Math.floor(Math.random()*4);
    const praiseText = LANG==='zh' ? UI.praiseZh[pIdx] : UI.praiseId[pIdx];
    const steps = [
      {key:k[LANG], text:it[LANG], lang:LANG, gap:200},
      {key:k[other], text:it[other], lang:other, gap:200},
      {key:`praise-${pIdx}-${LANG}`, text:praiseText, lang:LANG}
    ];
    playSequence(steps).then(()=>{
      if(screen!=='quiz' || !quiz.locked) return;
      if(quiz.round>=quiz.total){
        screen='finish'; render();
        sfx.fanfare();
        confettiBurst(60);
        setTimeout(()=>confettiBurst(40),700);
      } else {
        newQuestion(); render();
      }
    });
  } else {
    btn.classList.add('wrong');
    sfx.bad();
    setTimeout(()=>btn.classList.remove('wrong'),450);
    const tIdx = Math.floor(Math.random()*2);
    const msg = LANG==='zh' ? UI.tryZh[tIdx] : UI.tryId[tIdx];
    playSequence([{key:`try-${tIdx}-${LANG}`, text:msg, lang:LANG}]);
  }
}

/* ================= 情景对话游戏逻辑 ================= */
function startChat(set){
  sfx.pop();
  chat.set = set ? 1 : 0;
  chat.scene=0; chat.locked=false;
  screen='chat';
  render();
}
/* 播放当前角色台词：主语言在前，另一语言在后 */
function chatLine(){
  if(chat.locked) return;
  const scenes = chat.set ? CHAT_SCENES2 : CHAT_SCENES;
  const sc = scenes[chat.scene];
  const prefix = chat.set ? 'chat2' : 'chat';
  const i = chat.scene;
  const other = LANG==='zh' ? 'id' : 'zh';
  playSequence([
    {key:`${prefix}-c${i}-${LANG}`, text:sc.line[LANG], lang:LANG, gap:260},
    {key:`${prefix}-c${i}-${other}`, text:sc.line[other], lang:other}
  ]);
}
function chatAnswer(idx, btn){
  if(chat.locked) return;
  const scenes = chat.set ? CHAT_SCENES2 : CHAT_SCENES;
  const sc = scenes[chat.scene];
  const op = sc.options[idx];
  const phraseMap = chat.set ? Object.assign({},CHAT_PHRASES,CHAT_PHRASES2) : CHAT_PHRASES;
  const p = phraseMap[op.key];
  const prefix = chat.set ? 'chat2' : 'chat';
  const other = LANG==='zh' ? 'id' : 'zh';
  if(op.ok){
    chat.locked = true;
    btn.classList.add('correct');
    sfx.good();
    confettiBurst(26);
    const pIdx = Math.floor(Math.random()*4);
    const praiseText = LANG==='zh' ? UI.praiseZh[pIdx] : UI.praiseId[pIdx];
    playSequence([
      {key:`${prefix}-r-${op.key}-${LANG}`, text:p[LANG], lang:LANG, gap:200},
      {key:`${prefix}-r-${op.key}-${other}`, text:p[other], lang:other, gap:200},
      {key:`praise-${pIdx}-${LANG}`, text:praiseText, lang:LANG}
    ]).then(()=>{
      if(screen!=='chat' || !chat.locked) return;
      if(chat.scene >= scenes.length-1){
        screen='chatfinish'; render();
        confettiBurst(50);
        setTimeout(()=>confettiBurst(30),700);
      } else {
        chat.scene++; chat.locked=false; render();
      }
    });
  } else {
    btn.classList.add('wrong');
    sfx.bad();
    setTimeout(()=>btn.classList.remove('wrong'),450);
    const tIdx = Math.floor(Math.random()*2);
    const msg = LANG==='zh' ? UI.tryZh[tIdx] : UI.tryId[tIdx];
    playSequence([
      {key:`${prefix}-r-${op.key}-${LANG}`, text:p[LANG], lang:LANG, gap:160},
      {key:`try-${tIdx}-${LANG}`, text:msg, lang:LANG}
    ]);
  }
}

/* ================= 背景泡泡 ================= */
(function makeBubbles(){
  for(let i=0;i<10;i++){
    const b=document.createElement('div');
    b.className='bubble';
    const s=30+Math.random()*70;
    b.style.width=s+'px'; b.style.height=s+'px';
    b.style.left=(Math.random()*100)+'vw';
    b.style.animationDuration=(9+Math.random()*10)+'s';
    b.style.animationDelay=(-Math.random()*12)+'s';
    document.body.appendChild(b);
  }
})();

render();
</script>
